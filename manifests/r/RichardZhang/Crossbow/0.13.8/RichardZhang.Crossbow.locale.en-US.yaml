ShortDescription: Cross-platform proxy client with mihomo / sing-box dual core.
Description: |-
  Crossbow is an open-source, cross-platform proxy client built with Tauri 2, React and Rust.
  It supports mihomo / sing-box dual cores with one-click switching, subscription management,
  system proxy and TUN mode (independently controllable), connection and log inspection, and a
  menu-bar / tray live speed display. macOS builds are Developer ID signed and notarized; the
  Windows installer ships with a controlled system service for TUN.
